<!DOCTYPE html>
<html lang="en">

<head>
  <!--

  <title>Seraphim Recruitment Form</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Sekuya&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon.png">
		<link rel="shortcut-icon" type="image/png" href="img/favicon-32.png">
		<link rel="apple-touch-icon" sizes="180x180" href="img/favicon.png">
		<link rel="icon" sizes="192x192" href="img/favicon.png?v=2">
		<!-- Shortcut icon remains the for all icons for some reason -->
  <style>
        
    body {
        font-family: "Helvetica", sans-serif;
        background: linear-gradient(rgba(255, 255, 255, 0.7), rgba(204, 255, 255, 0.7), rgba(0, 255, 255, 0.3)), 
                    url(img/elrianode.jpg);
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }

    form {
        width: 60%;
        padding: 2em 3em;
        margin: 0 auto;
        background-color: #E8E8E8;
        border: 4px solid #C8A563;
    }

    header > h1, header > p {
        color: #A717FF;
    }

    label, h1, p {
        color: #000000;
    }

    header > h1, header > p {
        text-align: center;
        margin: 1em;
    }

    label {
        display: block;
        margin: 0.8em 0.2em;
        padding: 0.2em;
        font-size: 18px;
    }

    select, input[type="text"], input[type="email"], input[type="number"] {
        display: block;
        width: 100%;
        height: 20px;
        padding: 0.4em;
        margin: 0.25em 0;
    }

    select {
      height: 35px;
    }

    input[type="radio"] {
        margin: 0.1em;
        margin-right: 10px;
    }

    fieldset {
        border: 0;
        padding: 0;
        margin-bottom: 0.2em;
    }

    fieldset > p {
        margin-top: 0.2em;
        margin-bottom: 0.8em;
        margin-left: 0.4em;
        font-size: 18px;
    }

    .radioboxes { /* Adjusts the spacing for the radioboxes */
        display: inline-block;
        margin-top: 0.2em;
        margin-bottom: 0.2em;
    }

    fieldset#checkboxes > label {
      margin: 0.5em 0;
    }

    .input-checkbox {
        min-width: 1.125em;
        min-height: 1.125em;
        margin: 0.2em 0.5em 0em 0;
        vertical-align: middle;
    }

    textarea {
        width: 100%;
        height: 100px;
    }
  </style>

</head>

<body>

  <header>
    <button type="button" onclick="history.back()">Back</button>
    <h1 id="title">Seraphim Recruitment Form</h1>
    <p id="description">This survey form will involve questions regarding your Elsword account and experiences to see if you qualify for our guild.</p>
  </header>

  <form id="survey-form">
    <fieldset>
      <label for="username" id="name-label">Username:
        <input required id="name" type="text" placeholder="elsword_user_123123">
      </label>
      
      <label for="email" id="email-label">Email:
        <input required id="email" type="email" placeholder="elswordplayer@gmail.com">
      </label>

      <label for="age" id="number-label">Age (13+ only):
        <input required id="number" type="number" min=13 max=120 placeholder="13...">
      </label>
    </fieldset>

    <fieldset>
      <p>Are you registering an alt account?</p>

      <label class="radioboxes" for="alt-account">
        <input type="radio" id="alt-account" name="yes-or-no" value="is-alt">Yes
      </label>

      <label class="radioboxes" for="non-alt-account">
        <input type="radio" id="non-alt-account" name="yes-or-no" value="is-not-alt">No
      </label>
    </fieldset>

    <fieldset>
      <label for="role" id="role-label">Which option best describes your character's current role?
        <select name="role" id="dropdown">
          <option value="select-role">(Select current role)</option>
          <option value="dps">Damage Dealer (DPS)</option>
          <option value="sub-dps">Sub Damage Dealer (Sub-DPS)</option>
          <option value="buffer">Buffer (Supprt)</option>
          <option value="healer">Healer (Support/Heal)</option>
        </select>
      </label>

      <label for="character" id="label-character">Who is your character? <small>(*assumes level 99)</small>
        <select name="select-character" id="character">
          <option value="select-fav-character">(Select Character)</option>
          <option value="elsword">Elsword</option>
          <option value="aisha">Aisha</option>
          <option value="rena">Rena</option>
          <option value="raven">Raven</option>
          <option value="eve">Eve</option>
          <option value="elesis">Elesis</option>
          <option value="chung">Chung</option>
          <option value="ara">Ara</option>
          <option value="add">Add</option>
          <option value="luciel">Luciel</option>
          <option value="ain">Ain</option>
          <option value="rose">Rose</option>
          <option value="laby">Laby</option>
          <option value="noah">Noah</option>
        </select>
      </label>
    </fieldset>

    <fieldset id="checkboxes">
      <p>Areas of Expertise</p>

      <label for="raid-ready">
        <input type="checkbox" id="raid-ready" name="raid-ready-expert" value="raid-ready" class="input-checkbox">Raid-Ready (strictly raid account)
      </label>
      
    
      <label for="pve-expert">
        <input type="checkbox" id="pve-expert" name="pve-expert" value="pve-expert" class="input-checkbox">PvE Content (farming)
      </label>

      <label for="pvp-expert">
        <input type="checkbox" id="pvp-expert" name="pvp-expert" value="pvp-expert" class="input-checkbox">PvP Content
      </label>
    </fieldset>

    <fieldset id="text-area">
      <p>Why do you want to join our guild? <small>(Has to be same text as said in-game)</small></p>
      <text id="text-area-label" for="reason-to-join">
        <textarea required id="reason-to-join" type="text-area" rows="4" cols="30"></textarea>
      </label>
    </fieldset>

    <button type="submit" id="submit">Submit Recruitment</button>

  </form>



</body>

</html>
